[network_thresholds]
# Stage 1 — Binary Attack Detection threshold
# Minimum confidence to classify traffic as an attack
binary_threshold = 0.95

# Stage 2 — Attack Type Classification threshold
# Minimum confidence for attack type identification
classification_threshold = 0.85

# Display mode: "full" (binary + classification) or "binary" (attack only)
display_mode = full

[host_thresholds]
# Low Risk — Log & Monitor
low = 0.50

# Medium Risk — Restrict Access
medium = 0.70

# Critical Risk — Block & Isolate
critical = 0.90
