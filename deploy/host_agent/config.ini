[agent]
; Server address — set to AUTO for automatic discovery
; or set the exact IP of the IDS server
server_host = AUTO
server_port = 5000

; Authentication key — must match the backend's AGENT_KEY
agent_key = changeme

; Monitoring intervals (seconds)
interval = 10
window = 5

; API endpoint (don't change unless backend structure changes)
endpoint = /api/agent/host-report
